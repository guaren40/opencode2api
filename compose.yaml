services:
  opencode2api:
    build: .
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: "8080"
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
    volumes:
      - opencode2api-state:/var/lib/opencode2api
    tmpfs:
      - /tmp
volumes:
  opencode2api-state:
